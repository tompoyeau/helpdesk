<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - CAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="icone.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="js/planning-styles.css">
</head>

<body class="flex flex-col" style="min-height:100vh">

  <!-- HEADER -->
  <header class="app-header flex items-center justify-between px-4 py-0" style="height:52px;flex-shrink:0;position:sticky;top:0;z-index:100">

    <div class="flex items-center gap-3">
      <!-- Burger mobile (gauche) -->
      <button id="btnOpenLeft" class="btn-icon mobile-only" title="Collaborateurs">
        <i data-lucide="users" style="width:15px;height:15px;"></i>
      </button>

      <div class="app-logo">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="1" y="1" width="6" height="6" rx="1.5" fill="white" fill-opacity="0.9"/>
          <rect x="11" y="1" width="6" height="6" rx="1.5" fill="white" fill-opacity="0.55"/>
          <rect x="1" y="11" width="6" height="6" rx="1.5" fill="white" fill-opacity="0.55"/>
          <rect x="11" y="11" width="6" height="6" rx="1.5" fill="white" fill-opacity="0.9"/>
        </svg>
      </div>
      <div class="header-title-block">
        <h1 class="text-sm font-semibold tracking-tight leading-tight">Dashboard - CAI</h1>
        <p class="text-xs leading-tight hide-xs" style="color:rgba(255,255,255,0.4)">Pilotage de l'activité</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- Date range (masqué sur mobile, visible via sheet) -->
      <div class="date-range-group desktop-only">
        <span class="date-label">Du</span>
        <input type="date" id="filterStart" class="date-input">
        <span class="date-label">au</span>
        <input type="date" id="filterEnd" class="date-input">
      </div>

      <button id="refresh" class="btn-primary desktop-only">
        <i data-lucide="refresh-cw" style="width:12px;height:12px;"></i>
        Appliquer
      </button>

      <!-- Bouton filtre date mobile -->
      <button id="btnDateSheet" class="btn-icon mobile-only" title="Filtrer par date">
        <i data-lucide="calendar" style="width:15px;height:15px;"></i>
      </button>

      <div class="header-sep desktop-only"></div>

      <button id="toggleDark" class="btn-icon" title="Mode sombre">
        <i id="darkIcon" data-lucide="moon" style="width:15px;height:15px;"></i>
      </button>

      <!-- Catégories (mobile) -->
      <button id="btnOpenRight" class="btn-icon mobile-only" title="Catégories">
        <i data-lucide="tag" style="width:15px;height:15px;"></i>
      </button>
    </div>
  </header>


  <!-- BACKDROP drawers -->
  <div id="drawerBackdrop" class="drawer-backdrop" onclick="closeAllDrawers()"></div>


  <!-- LAYOUT -->
  <div class="layout-body">

    <!-- DRAWER GAUCHE — Collaborateurs -->
    <aside id="sidebarLeft" class="app-sidebar sidebar-left flex flex-col min-h-0">

      <!-- En-tête drawer mobile -->
      <div class="drawer-header desktop-only-none">
        <span class="drawer-title">Collaborateurs</span>
        <button class="btn-icon btn-icon-sm" onclick="closeAllDrawers()">
          <i data-lucide="x" style="width:14px;height:14px;"></i>
        </button>
      </div>

      <div class="p-3" style="border-bottom:1px solid var(--border)">
        <button id="viewGlobal" class="btn-dashboard w-full mb-2.5">
          <i data-lucide="layout-dashboard" style="width:13px;height:13px;"></i>
          Tableau de bord
        </button>
        
        <button id="viewPlanning" class="btn-dashboard w-full mb-2.5">
          <i data-lucide="calendar-days" style="width:13px;height:13px;"></i>
          Planning - Work in progress
        </button>

        <label class="toggle-label flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="filterActive" checked class="toggle-input">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-text">Actifs seulement</span>
        </label>
      </div>

      <div class="px-3 py-2" style="border-bottom:1px solid var(--border)">
        <div class="search-wrapper">
          <i data-lucide="search" class="search-icon" style="width:12px;height:12px;"></i>
          <input id="personSearch" placeholder="Rechercher…" class="search-input">
        </div>
      </div>

      <div class="px-3 pt-3 pb-1">
        <span class="sidebar-section-label">Collaborateurs</span>
      </div>

      <div class="scroll-area flex-1">
        <ul id="personList" class="px-2 pb-2"></ul>
      </div>

    </aside>

    <!-- CONTENU CENTRAL -->
    <main class="layout-main flex flex-col" style="background:var(--bg-surface)">

      <!-- VUE PLANNING -->
      <section id="planningView">
        <div id="planningContent"></div>
      </section>

      <!-- CHARTS -->
      <section id="dashboardView">
        <div id="chartsBlock" class="grid charts-container" style="grid-template-columns:1fr 1fr"></div>
      
        <!-- DETAILS -->
        <div style="padding:12px 12px 12px">
          <div id="center" class="content-card text-xs">Chargement…</div>
        </div>
      </section>

    </main>

    <!-- DRAWER DROIT — Catégories -->
    <aside id="sidebarRight" class="app-sidebar sidebar-right flex flex-col min-h-0">

      <!-- En-tête drawer mobile -->
      <div class="drawer-header desktop-only-none">
        <span class="drawer-title">Catégories</span>
        <button class="btn-icon btn-icon-sm" onclick="closeAllDrawers()">
          <i data-lucide="x" style="width:14px;height:14px;"></i>
        </button>
      </div>

      <div class="px-3 pt-3 pb-1">
        <span class="sidebar-section-label">Catégories</span>
      </div>
      <div class="scroll-area flex-1">
        <ul id="categoryList" class="px-2 pb-2"></ul>
      </div>
    </aside>

  </div>


  <!-- BOTTOM SHEET — Filtres date (mobile) -->
  <div id="dateSheet" class="bottom-sheet">
    <div class="bottom-sheet-handle"></div>
    <h3 class="bottom-sheet-title">Filtrer par période</h3>
    <div class="bottom-sheet-body">
      <label class="sheet-label">Date de début</label>
      <input type="date" id="filterStartMobile" class="sheet-date-input">
      <label class="sheet-label" style="margin-top:12px">Date de fin</label>
      <input type="date" id="filterEndMobile" class="sheet-date-input">
      <button id="refreshMobile" class="login-btn" style="margin-top:16px">
        <i data-lucide="refresh-cw" style="width:13px;height:13px;display:inline;margin-right:6px"></i>
        Appliquer
      </button>
    </div>
  </div>
  <div id="sheetBackdrop" class="drawer-backdrop" onclick="closeDateSheet()"></div>


  <!-- OVERLAY DE LOGIN -->
  <div id="loginOverlay">
    <div class="login-card">
      <div class="login-logo">
        <svg width="22" height="22" viewBox="0 0 18 18" fill="none">
          <rect x="1" y="1" width="6" height="6" rx="1.5" fill="white" fill-opacity="0.9"/>
          <rect x="11" y="1" width="6" height="6" rx="1.5" fill="white" fill-opacity="0.55"/>
          <rect x="1" y="11" width="6" height="6" rx="1.5" fill="white" fill-opacity="0.55"/>
          <rect x="11" y="11" width="6" height="6" rx="1.5" fill="white" fill-opacity="0.9"/>
        </svg>
      </div>
      <h2 class="login-title">Dashboard - CAI</h2>
      <p class="login-subtitle">Accès restreint — entrez le mot de passe pour continuer</p>
      <form id="loginForm">
        <div class="login-field">
          <i data-lucide="lock" class="login-field-icon" style="width:14px;height:14px"></i>
          <input id="loginPassword" type="password" placeholder="Mot de passe" class="login-input" autocomplete="current-password">
        </div>
        <p id="loginError" class="login-error" style="display:none">
          <i data-lucide="alert-circle" style="width:13px;height:13px;flex-shrink:0"></i>
          Mot de passe incorrect
        </p>
        <button id="loginBtn" type="submit" class="login-btn">Accéder</button>
      </form>
    </div>
  </div>

  <!-- JS -->
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/planning.js"></script>

</body>
</html>
